<style>
	*{
	padding: 0px;
	margin: 0px;
}
	body{
		margin: 0;
		background-color: black;
	}
	header{
		background-color: black;
		width: 100%;
		height: 8vh;
		color: white;
		text-decoration: underline;
		font-size: 50px;
		cursor: pointer;
	}
	header a:hover{
		color: greenyellow;
	}
	#menu a:hover{
		background-color: greenyellow;
		text-decoration: underline;
		cursor: pointer;
		opacity: 80%;
	}
	a{
		transition: all 0.5s linear 0.5s;
		color: white;
	}
	#menu{
		width: 100%;
		height: 5vh;
		background-color: black;
		text-align: center;
	}
	#menu li{
	display: inline-block;
	margin: 0;
	padding: 0;
	font-size: 40px;
	text-indent: 40px;
}

	#games img:hover{
		transform: scale(2.0, 2.0);
	}
	#games {
    width: 100%;
    min-height: 35vh;
    height: auto;
    background-color: black;
    text-align: center;
    padding: 10px 0;
    box-sizing: border-box;
}

	#games img {
    width: 220px;
    height: 280px;
    object-fit: contain;
    display: inline-block;
    margin: 10px;
    vertical-align: top;
    max-width: 90%;
    transition: all 0.75s ease-in 0s;
}

	#category{
		background-color: black;
		text-align: center;
	}
	#category li{
	display: inline-block;
	margin: 0 15px;
	padding: 0;
	font-size: 40px;
	color: lightcyan;
	text-align: center;
	}
	#category li:hover{
		text-decoration: underline;
		transition: all 0.5s linear 0s;
		cursor: pointer;
		background-color: darkblue;
	}
	hr{
		background-color: lightcyan;
	}
	#end li{
	margin: 0;
	padding: 0;
	font-size: 40px;
	text-indent: 40px;
	color: lightcyan;
	text-align: left;
	transition: all 1s ease-in 0s;
	}
	#end li:hover{
		background-color: red;
		cursor: pointer;
	}
	#end{
		width: 100%;
		height: 20vh;
		background-color: black;
	}
	button{
		float: right;
	}
	#banner{
		display: block;
		margin: 0 auto;
		cursor: pointer;
		width: 100%;
	}
	body > img {
    display: block;
    width: 100%;
    height: auto;
}
	button {
    padding: 8px 12px;
    margin: 5px;
    border: 1px solid lightcyan;
    border-radius: 4px;
    background-color: #202020;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.25s ease;
}
</style>
